# Production deployment workflow for Start Permis
# Deploys to Firebase Hosting when pushing to main branch

name: Deploy to Firebase Hosting (Production)

on:
  push:
    branches:
      - main
      - master

permissions:
  checks: write
  contents: read

jobs:
  deploy_production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore Rules
        run: firebase deploy --only firestore:rules --project scaoalauto
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        continue-on-error: true

      - name: Deploy Realtime Database Rules
        run: firebase deploy --only database --project scaoalauto
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        continue-on-error: true

      - name: Deploy Storage Rules
        run: firebase deploy --only storage --project scaoalauto
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        continue-on-error: true

      - name: Deploy Firestore Indexes
        run: firebase deploy --only firestore:indexes --project scaoalauto
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        continue-on-error: true

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SCAOALAUTO }}
          channelId: live
          projectId: scaoalauto

      - name: Deployment Summary
        run: |
          echo "## Deployment Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** scaoalauto" >> $GITHUB_STEP_SUMMARY
          echo "**URLs:**" >> $GITHUB_STEP_SUMMARY
          echo "- https://scaoalauto.web.app" >> $GITHUB_STEP_SUMMARY
          echo "- https://scaoalauto.firebaseapp.com" >> $GITHUB_STEP_SUMMARY
