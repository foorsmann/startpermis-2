# Firebase Hosting PR Preview + Visual Regression Guardrail
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  # =============================================================================
  # JOB 1: Deploy PR Preview to Firebase Hosting
  # =============================================================================
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.hosting_deploy.outputs.details_url }}
      urls_json: ${{ steps.hosting_deploy.outputs.urls }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting Preview Channel
        id: hosting_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SCAOALAUTO }}
          projectId: scaoalauto

      - name: Output Preview URL
        run: |
          echo "## Firebase Preview Deployed" >> $GITHUB_STEP_SUMMARY
          echo "Preview URL: ${{ steps.hosting_deploy.outputs.details_url }}" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # JOB 2: Visual Regression Testing (Screenshots + Diff)
  # =============================================================================
  visual_regression:
    needs: build_and_preview
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: ${{ needs.build_and_preview.outputs.preview_url }}
      PRODUCTION_URL: https://scaoalauto.web.app
      DIFF_THRESHOLD: 0.8  # Percentage threshold for visual diff failure
    outputs:
      diff_failed: ${{ steps.analyze_diff.outputs.diff_failed }}
      diff_summary: ${{ steps.analyze_diff.outputs.diff_summary }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright and dependencies
        run: |
          npm init -y
          npm install playwright pixelmatch pngjs
          npx playwright install chromium
          npx playwright install-deps chromium

      - name: Create Visual Regression Script
        run: |
          cat > visual-regression.js << 'SCRIPT_EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const { PNG } = require('pngjs');
          const pixelmatch = require('pixelmatch');

          const PREVIEW_URL = process.env.PREVIEW_URL || '';
          const PRODUCTION_URL = process.env.PRODUCTION_URL || 'https://scaoalauto.web.app';
          const DIFF_THRESHOLD = parseFloat(process.env.DIFF_THRESHOLD) || 0.8;

          // Routes to test (public pages only)
          const ROUTES = [
            { path: '/', name: 'homepage' },
            { path: '/login.html', name: 'login' },
            { path: '/sign-up.html', name: 'signup' },
            { path: '/mediu-invatare.html', name: 'mediu-invatare' },
            { path: '/teste-examen.html', name: 'teste-examen' },
            { path: '/codul-rutier.html', name: 'codul-rutier' },
            { path: '/setari.html', name: 'setari' }
          ];

          // Viewports to test
          const VIEWPORTS = [
            { width: 1440, height: 900, name: 'desktop' },
            { width: 390, height: 844, name: 'mobile' }
          ];

          // CSS to disable animations and transitions
          const DISABLE_ANIMATIONS_CSS = `
            *, *::before, *::after {
              animation-duration: 0s !important;
              animation-delay: 0s !important;
              transition-duration: 0s !important;
              transition-delay: 0s !important;
              scroll-behavior: auto !important;
            }
          `;

          async function waitForPageReady(page) {
            try {
              // Wait for fonts to load
              await page.evaluate(() => document.fonts.ready);
              // Wait for network idle
              await page.waitForLoadState('networkidle', { timeout: 15000 });
              // Additional wait for any lazy-loaded content
              await page.waitForTimeout(1000);
            } catch (e) {
              console.log('  Warning: Page ready timeout, continuing...');
            }
          }

          async function takeScreenshot(page, url, outputPath) {
            try {
              console.log(`  Navigating to ${url}...`);
              const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });

              if (!response || response.status() >= 400) {
                console.log(`  Warning: Page returned status ${response?.status() || 'unknown'}`);
                return { success: false, skipped: true, reason: `HTTP ${response?.status() || 'error'}` };
              }

              // Inject CSS to disable animations
              await page.addStyleTag({ content: DISABLE_ANIMATIONS_CSS });

              await waitForPageReady(page);

              // Take full page screenshot
              await page.screenshot({ path: outputPath, fullPage: true });
              console.log(`  Screenshot saved: ${outputPath}`);
              return { success: true };
            } catch (error) {
              console.log(`  Error taking screenshot: ${error.message}`);
              return { success: false, skipped: true, reason: error.message };
            }
          }

          function calculateDiff(img1Path, img2Path, diffPath) {
            try {
              const img1Data = fs.readFileSync(img1Path);
              const img2Data = fs.readFileSync(img2Path);

              const img1 = PNG.sync.read(img1Data);
              const img2 = PNG.sync.read(img2Data);

              // Handle different image sizes by using the larger dimensions
              const width = Math.max(img1.width, img2.width);
              const height = Math.max(img1.height, img2.height);

              // Create normalized images with same dimensions
              const normalized1 = new PNG({ width, height });
              const normalized2 = new PNG({ width, height });

              // Fill with white background
              normalized1.data.fill(255);
              normalized2.data.fill(255);

              // Copy image data
              PNG.bitblt(img1, normalized1, 0, 0, img1.width, img1.height, 0, 0);
              PNG.bitblt(img2, normalized2, 0, 0, img2.width, img2.height, 0, 0);

              const diff = new PNG({ width, height });
              const diffPixels = pixelmatch(
                normalized1.data,
                normalized2.data,
                diff.data,
                width,
                height,
                { threshold: 0.1, includeAA: false }
              );

              fs.writeFileSync(diffPath, PNG.sync.write(diff));

              const totalPixels = width * height;
              const diffPercent = (diffPixels / totalPixels) * 100;

              return {
                diffPixels,
                totalPixels,
                diffPercent: diffPercent.toFixed(2),
                width,
                height
              };
            } catch (error) {
              console.log(`  Error calculating diff: ${error.message}`);
              return { error: error.message };
            }
          }

          async function run() {
            console.log('='.repeat(60));
            console.log('Visual Regression Testing');
            console.log('='.repeat(60));
            console.log(`Production URL: ${PRODUCTION_URL}`);
            console.log(`Preview URL: ${PREVIEW_URL}`);
            console.log(`Diff Threshold: ${DIFF_THRESHOLD}%`);
            console.log('='.repeat(60));

            if (!PREVIEW_URL) {
              console.error('ERROR: PREVIEW_URL is not set');
              process.exit(1);
            }

            // Create output directories
            const dirs = ['artifacts/visual-diff/production', 'artifacts/visual-diff/preview', 'artifacts/visual-diff/diff'];
            dirs.forEach(dir => fs.mkdirSync(dir, { recursive: true }));

            const browser = await chromium.launch({ headless: true });
            const results = [];
            let hasFailure = false;

            for (const viewport of VIEWPORTS) {
              console.log(`\n📱 Testing viewport: ${viewport.name} (${viewport.width}x${viewport.height})`);

              const context = await browser.newContext({
                viewport: { width: viewport.width, height: viewport.height },
                deviceScaleFactor: 1
              });
              const page = await context.newPage();

              for (const route of ROUTES) {
                console.log(`\n📄 Route: ${route.path}`);

                const baseName = `${route.name}-${viewport.name}`;
                const prodPath = `artifacts/visual-diff/production/${baseName}.png`;
                const prevPath = `artifacts/visual-diff/preview/${baseName}.png`;
                const diffPath = `artifacts/visual-diff/diff/${baseName}-diff.png`;

                // Screenshot production
                console.log('  [Production]');
                const prodResult = await takeScreenshot(page, `${PRODUCTION_URL}${route.path}`, prodPath);

                // Screenshot preview
                console.log('  [Preview]');
                const prevResult = await takeScreenshot(page, `${PREVIEW_URL}${route.path}`, prevPath);

                const result = {
                  route: route.path,
                  name: route.name,
                  viewport: viewport.name,
                  prodScreenshot: prodResult.success,
                  prevScreenshot: prevResult.success,
                  skipped: false,
                  skipReason: null,
                  diffPercent: null,
                  failed: false
                };

                if (!prodResult.success || !prevResult.success) {
                  result.skipped = true;
                  result.skipReason = !prodResult.success
                    ? `Production: ${prodResult.reason}`
                    : `Preview: ${prevResult.reason}`;
                  console.log(`  ⏭️  Skipped: ${result.skipReason}`);
                } else {
                  // Calculate diff
                  console.log('  [Calculating diff...]');
                  const diffResult = calculateDiff(prodPath, prevPath, diffPath);

                  if (diffResult.error) {
                    result.skipped = true;
                    result.skipReason = diffResult.error;
                  } else {
                    result.diffPercent = parseFloat(diffResult.diffPercent);
                    result.diffPixels = diffResult.diffPixels;
                    result.totalPixels = diffResult.totalPixels;

                    if (result.diffPercent > DIFF_THRESHOLD) {
                      result.failed = true;
                      hasFailure = true;
                      console.log(`  ❌ DIFF: ${result.diffPercent}% (threshold: ${DIFF_THRESHOLD}%)`);
                    } else {
                      console.log(`  ✅ DIFF: ${result.diffPercent}% (within threshold)`);
                    }
                  }
                }

                results.push(result);
              }

              await context.close();
            }

            await browser.close();

            // Write results JSON
            const summary = {
              timestamp: new Date().toISOString(),
              productionUrl: PRODUCTION_URL,
              previewUrl: PREVIEW_URL,
              threshold: DIFF_THRESHOLD,
              hasFailure,
              results
            };

            fs.writeFileSync('artifacts/visual-diff/results.json', JSON.stringify(summary, null, 2));

            // Print summary
            console.log('\n' + '='.repeat(60));
            console.log('SUMMARY');
            console.log('='.repeat(60));

            const table = results.map(r => ({
              Route: r.route,
              Viewport: r.viewport,
              Status: r.skipped ? '⏭️ Skipped' : (r.failed ? '❌ FAILED' : '✅ OK'),
              'Diff %': r.diffPercent !== null ? `${r.diffPercent}%` : 'N/A',
              Reason: r.skipReason || ''
            }));
            console.table(table);

            if (hasFailure) {
              console.log('\n❌ Visual regression detected! Some pages exceed the diff threshold.');
              process.exit(1);
            } else {
              console.log('\n✅ All visual checks passed!');
              process.exit(0);
            }
          }

          run().catch(err => {
            console.error('Fatal error:', err);
            process.exit(1);
          });
          SCRIPT_EOF

      - name: Run Visual Regression Tests
        id: run_tests
        continue-on-error: true
        run: node visual-regression.js

      - name: Analyze Results
        id: analyze_diff
        run: |
          if [ -f "artifacts/visual-diff/results.json" ]; then
            DIFF_FAILED=$(node -e "const r=require('./artifacts/visual-diff/results.json'); console.log(r.hasFailure ? 'true' : 'false')")
            echo "diff_failed=$DIFF_FAILED" >> $GITHUB_OUTPUT

            # Generate markdown summary
            SUMMARY=$(node -e "
              const r = require('./artifacts/visual-diff/results.json');
              let md = '## Visual Regression Report\\n\\n';
              md += '| Route | Viewport | Status | Diff % |\\n';
              md += '|-------|----------|--------|--------|\\n';
              r.results.forEach(row => {
                const status = row.skipped ? '⏭️ Skipped' : (row.failed ? '❌ FAILED' : '✅ OK');
                const diff = row.diffPercent !== null ? row.diffPercent + '%' : 'N/A';
                md += '| ' + row.route + ' | ' + row.viewport + ' | ' + status + ' | ' + diff + ' |\\n';
              });
              md += '\\n**Threshold:** ' + r.threshold + '%\\n';
              if (r.hasFailure) {
                md += '\\n⚠️ **Visual regression detected!** Review the diff images in artifacts.\\n';
              }
              console.log(md);
            ")
            echo "diff_summary<<EOF" >> $GITHUB_OUTPUT
            echo "$SUMMARY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "diff_failed=false" >> $GITHUB_OUTPUT
            echo "diff_summary=No results available" >> $GITHUB_OUTPUT
          fi

      - name: Upload Visual Diff Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-results
          path: artifacts/visual-diff/
          retention-days: 14

      - name: Post PR Comment with Results
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            let body = '## 🔍 Visual Regression Report\n\n';

            try {
              const results = JSON.parse(fs.readFileSync('artifacts/visual-diff/results.json', 'utf8'));

              body += `**Production:** ${results.productionUrl}\n`;
              body += `**Preview:** ${results.previewUrl}\n`;
              body += `**Threshold:** ${results.threshold}%\n\n`;

              body += '| Route | Viewport | Status | Diff % |\n';
              body += '|-------|----------|--------|--------|\n';

              for (const row of results.results) {
                const status = row.skipped ? '⏭️ Skipped' : (row.failed ? '❌ FAILED' : '✅ OK');
                const diff = row.diffPercent !== null ? `${row.diffPercent}%` : 'N/A';
                body += `| ${row.route} | ${row.viewport} | ${status} | ${diff} |\n`;
              }

              body += '\n';

              if (results.hasFailure) {
                body += '### ⚠️ Visual Regression Detected!\n\n';
                body += 'Some pages exceed the visual diff threshold. Please review the diff images in the workflow artifacts.\n\n';
              } else {
                body += '### ✅ All Visual Checks Passed\n\n';
              }

              body += `📎 [View Artifacts](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})\n`;

            } catch (e) {
              body += '⚠️ Could not load visual regression results.\n';
              body += `Error: ${e.message}\n`;
            }

            // Find existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Visual Regression Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Fail if visual regression detected
        if: steps.run_tests.outcome == 'failure'
        run: |
          echo "❌ Visual regression tests failed!"
          exit 1

  # =============================================================================
  # JOB 3: Gemini UI/UX Review (Optional)
  # =============================================================================
  gemini_uiux_review:
    needs: [build_and_preview, visual_regression]
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.visual_regression.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: ${{ needs.build_and_preview.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Gemini API Key
        id: check_key
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "has_key=false" >> $GITHUB_OUTPUT
            echo "⚠️ GEMINI_API_KEY secret is not configured. Skipping Gemini UI/UX review."
            echo "To enable this feature, add GEMINI_API_KEY to your repository secrets."
          else
            echo "has_key=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check_key.outputs.has_key == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.check_key.outputs.has_key == 'true'
        run: |
          npm init -y
          npm install playwright @google/generative-ai
          npx playwright install chromium
          npx playwright install-deps chromium

      - name: Take Screenshots for Gemini Review
        if: steps.check_key.outputs.has_key == 'true'
        run: |
          mkdir -p gemini-screenshots

          cat > take-screenshots.js << 'SCRIPT_EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const PREVIEW_URL = process.env.PREVIEW_URL || '';

          const SCREENSHOTS = [
            { path: '/', name: 'homepage-desktop', viewport: { width: 1440, height: 900 } },
            { path: '/', name: 'homepage-mobile', viewport: { width: 390, height: 844 } },
            { path: '/mediu-invatare.html', name: 'mediu-invatare-desktop', viewport: { width: 1440, height: 900 } },
            { path: '/mediu-invatare.html', name: 'mediu-invatare-mobile', viewport: { width: 390, height: 844 } }
          ];

          const DISABLE_ANIMATIONS_CSS = `
            *, *::before, *::after {
              animation-duration: 0s !important;
              transition-duration: 0s !important;
            }
          `;

          async function run() {
            const browser = await chromium.launch({ headless: true });

            for (const ss of SCREENSHOTS) {
              console.log(`Taking screenshot: ${ss.name}`);
              const context = await browser.newContext({ viewport: ss.viewport });
              const page = await context.newPage();

              try {
                await page.goto(`${PREVIEW_URL}${ss.path}`, { waitUntil: 'networkidle', timeout: 30000 });
                await page.addStyleTag({ content: DISABLE_ANIMATIONS_CSS });
                await page.evaluate(() => document.fonts.ready);
                await page.waitForTimeout(1000);
                await page.screenshot({ path: `gemini-screenshots/${ss.name}.png`, fullPage: true });
                console.log(`  ✅ Saved ${ss.name}.png`);
              } catch (e) {
                console.log(`  ❌ Error: ${e.message}`);
              }

              await context.close();
            }

            await browser.close();
          }

          run().catch(console.error);
          SCRIPT_EOF

          node take-screenshots.js

      - name: Run Gemini UI/UX Analysis
        if: steps.check_key.outputs.has_key == 'true'
        id: gemini_review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > gemini-review.js << 'SCRIPT_EOF'
          const { GoogleGenerativeAI } = require('@google/generative-ai');
          const fs = require('fs');
          const path = require('path');

          async function run() {
            const genAI = new GoogleGenerativeAI(process.env.GEMINI_API_KEY);

            // Use gemini-1.5-pro for vision capabilities (gemini-3-pro-preview may not be available)
            const model = genAI.getGenerativeModel({ model: 'gemini-1.5-pro' });

            // Load screenshots
            const screenshotDir = 'gemini-screenshots';
            const files = fs.readdirSync(screenshotDir).filter(f => f.endsWith('.png'));

            if (files.length === 0) {
              console.log('No screenshots found for analysis');
              process.exit(0);
            }

            const imageParts = files.map(file => ({
              inlineData: {
                data: fs.readFileSync(path.join(screenshotDir, file)).toString('base64'),
                mimeType: 'image/png'
              }
            }));

            const prompt = `You are a UI/UX expert reviewing a Romanian driving school web application called "Start Permis".

          I'm providing you with ${files.length} screenshots from the application:
          ${files.map((f, i) => `${i + 1}. ${f}`).join('\n')}

          Please analyze these screenshots and provide a UI/UX review with the following structure:

          ## UI/UX Analysis Report

          ### P0 - Critical Issues (Must Fix)
          List any critical usability or accessibility issues that severely impact user experience.

          ### P1 - Important Issues (Should Fix)
          List important issues that affect user experience but don't completely block functionality.

          ### P2 - Minor Issues (Nice to Have)
          List minor improvements that would enhance the experience.

          ### Positive Observations
          List things that are done well in the current design.

          ### Recommendations Summary
          Provide 3-5 actionable recommendations prioritized by impact.

          IMPORTANT NOTES:
          - Focus on UI/UX aspects only (layout, typography, colors, spacing, accessibility, mobile responsiveness)
          - Do NOT suggest code changes
          - Be specific about which page/viewport each issue affects
          - Consider Romanian language context for text readability
          - Keep the review concise and actionable`;

            try {
              const result = await model.generateContent([prompt, ...imageParts]);
              const response = await result.response;
              const text = response.text();

              // Save the review
              fs.writeFileSync('gemini-review.md', text);
              console.log('Gemini review saved to gemini-review.md');
              console.log('\n' + text);
            } catch (error) {
              console.error('Error calling Gemini API:', error.message);
              fs.writeFileSync('gemini-review.md', `## Gemini Review Failed\n\nError: ${error.message}\n`);
              process.exit(1);
            }
          }

          run();
          SCRIPT_EOF

          node gemini-review.js

      - name: Post Gemini Review as PR Comment
        if: steps.check_key.outputs.has_key == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## 🤖 Gemini UI/UX Review\n\n';

            try {
              const review = fs.readFileSync('gemini-review.md', 'utf8');
              body += review;
              body += '\n\n---\n_This review was generated by Gemini AI based on preview screenshots._';
            } catch (e) {
              body += '⚠️ Could not load Gemini review.\n';
              body += `Error: ${e.message}\n`;
            }

            // Find existing Gemini comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Gemini UI/UX Review')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Upload Gemini Review Artifacts
        if: steps.check_key.outputs.has_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gemini-uiux-review
          path: |
            gemini-screenshots/
            gemini-review.md
          retention-days: 14

      - name: Skip Notice
        if: steps.check_key.outputs.has_key != 'true'
        run: |
          echo "## Gemini UI/UX Review - Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The GEMINI_API_KEY secret is not configured." >> $GITHUB_STEP_SUMMARY
          echo "To enable AI-powered UI/UX reviews, add the GEMINI_API_KEY to your repository secrets." >> $GITHUB_STEP_SUMMARY
