  <script>
(function () {
  var root = document.documentElement;
  if (root.classList.contains('wf-design-mode')) return;
  var qs = new URLSearchParams(window.location.search);
  var mode = qs.get('mode');
  var target = null;
  if (mode === 'verifyEmail') target = '/confirmare-email';
  else if (mode === 'resetPassword') target = '/resetare-parola';
  if (target) {
    // pastram EXACT query string-ul (oobCode, continueUrl, lang etc.)
    window.location.replace(target + window.location.search + window.location.hash);
    return;
  }
  // fallback: daca cineva intra manual pe /auth fara parametri
  root.classList.remove('auth-router-preload');
})();
</script>
