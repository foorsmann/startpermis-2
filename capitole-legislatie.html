  /* ========= NEW: binder pentru efectul „pressed” (scale 0.98) ========= */
  function bindPressFeedback(header,content){

    const observer=new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        const video=entry.target.querySelector('video'); if(!video) return;
        if(!video._hasUserPlayed) return;
        if(entry.isIntersecting){
          if(video._autoPaused){video.play().catch(()=>{});video._autoPaused=false;}
        }else{
          if(!video.paused){video._autoPaused=true;video.pause();}
        }
      });
    },{root:lessonContent,threshold:.25});
    function observeVideos(){
      videoWrapper.querySelectorAll('video').forEach(video=>{
        video._hasUserPlayed=false; video._autoPaused=false;
        video.addEventListener('play',()=>{video._hasUserPlayed=true;video._autoPaused=false;});
        video.addEventListener('pause',()=>{if(!video._autoPaused) video._autoPaused=false;});
        observer.observe(video.parentElement||video);
      });
    }
    observeVideos();
    window.__observeLegislateVideos=observeVideos;
  }
  /* ================== RENDER fallback (fără pagini) ================== */
  function renderNoPages(){
    section.classList.remove('visible');
    setChapterProgressUI('','--/--');
    titleEl.textContent='';
    imageEl.style.display='none';
    videoWrapper.innerHTML='';
    section.style.display='flex';
    nextBtn.style.display='none';
    hideLoader();
    setTimeout(()=>section.classList.add('visible'),10);
  }
  /* ================== Persist progres ================== */
  function saveUserProgress(ptr){
    if(!userId||!chapterId) return;
    const progressRef=db.collection('users').doc(userId).collection('progress_legislatie').doc(chapterId);
    let payload={};
    if(ptr==='done') payload={done:true,pagePointer:pagesIndexes.length-1,updated:new Date()};
    else payload={done:false,pagePointer:ptr,updated:new Date()};
    progressRef.set(payload,{merge:true});
  }
  async function isUltimulCapitol(){
    const chaptersSnap=await db.collection('legislatie_chapters').orderBy('index').get();
    let chapters=[]; chaptersSnap.forEach(doc=>chapters.push({id:doc.id}));
    const idx=chapters.findIndex(c=>c.id===chapterId);
    return (idx===chapters.length-1);
  }
  /* ================== Animare bară + procent FINAL ================== */
  function animateChapterProgressBar(barOuter,barGreen,percentEl,percentDone,duration=900){
    if(!barOuter||!barGreen||!percentEl) return;
    barGreen.style.display="block";
    percentEl.style.opacity="1";
    barGreen.style.transition="none";
    barGreen.style.width="0%";
    percentEl.textContent="0%";
    void barGreen.offsetWidth;
    requestAnimationFrame(()=>{
      barGreen.style.transition=`width ${duration}ms cubic-bezier(.68,-0.55,.27,1.55)`;
      const start=performance.now();
      function animatePercent(now){
        let elapsed=Math.min(now-start,duration);
        let percent=Math.round((elapsed/duration)*percentDone);
        percentEl.textContent=percent+"%";
        if(elapsed<duration) requestAnimationFrame(animatePercent);
        else percentEl.textContent=percentDone+"%";
      }
      requestAnimationFrame(animatePercent);
      barGreen.style.width=percentDone+"%";
    });
  }
  /* ================== Calcul local progres FINAL ================== */
  function showChapterProgressFinalLocal(prog){
    ensureFinalPercentEl();
    if(!barOuterFinal||!barGreenFinal||!percentElFinal) return;
    const total=Math.max(1,pagesIndexes.length|0);
    let pagesDone=0;
    if(prog&&typeof prog.pagePointer==='number'){
      pagesDone=Math.min(total,(prog.pagePointer|0)+1);
      if(prog.done===true) pagesDone=total;
    }else if(window._chapterFinalized){
      pagesDone=total;
    }else{
      pagesDone=Math.min(total,(currentPointer|0)+1);
    }
    const percentDone=Math.round((pagesDone/total)*100);
    setTimeout(()=>animateChapterProgressBar(barOuterFinal,barGreenFinal,percentElFinal,percentDone),30);
  }
  // Close btn
  document.querySelector('.close-btn')?.addEventListener('click',()=>{window.location.href='/legislatie';});
  /* ================== RENDER PAGE ================== */
  async function renderPage(ptr){
    currentPointer=ptr;
    section.classList.remove('visible');
    await new Promise(res=>setTimeout(res,350));
    if(!pagesIndexes.length||ptr<0||ptr>=pagesIndexes.length){renderNoPages();return;}
    const idx=pagesIndexes[ptr];
    let page=pageBuffer[idx];
    if(!page){
      showLoader();
      const snap=await db.collection("legislatie_pages")
        .where("chapterSlug","==",chapterId)
        .where("index","==",idx)
        .limit(1).get();
      hideLoader();
      if(snap.empty){renderNoPages();return;}
      page={id:snap.docs[0].id,...snap.docs[0].data()};
      pageBuffer[idx]=page;
    }
    const progressText=`${pad2(ptr+1)}/${pad2(pagesIndexes.length)}`;
    setChapterProgressUI(chapterTitle||'',progressText);
    titleEl.textContent=page.question||'(fără titlu)';
    cleanVideoWrapper();
    let videoSet=false;
    if(page.video&&page.video.trim().length>5){
      let url=page.video.trim();
      if(url.match(/\.(mp4|webm|ogg)(\?|$)/i)){
        const vid=document.createElement('video');
        vid.className="plyr-player";
        vid.setAttribute('controls','');
        vid.setAttribute('playsinline','');
        vid.innerHTML=`<source src="${url}" type="video/mp4">Video not supported.`;
        videoWrapper.appendChild(vid);
        videoSet=true;
      }else if(url.includes('youtube.com')||url.includes('youtu.be')){
        let ytId=''; const match=url.match(/(?:youtube\.com.*[?&]v=|youtu\.be\/)([^&]+)/);
        if(match&&match[1]) ytId=match[1];
        if(ytId){
          videoWrapper.innerHTML=`
            <div class="plyr__video-embed">
              <iframe src="https://www.youtube.com/embed/${ytId}?origin=${location.origin}&iv_load_policy=3&modestbranding=1&rel=0"
                allowfullscreen allowtransparency allow="autoplay"></iframe>
            </div>`;
          videoSet=true;
        }
      }
    }
    if(!videoSet){
      videoWrapper.innerHTML='';
      if(page.image&&page.image.trim().length>3){
        imageEl.src=page.image; imageEl.style.display='block';
      }else{imageEl.style.display='none';}
    }else{imageEl.style.display='none';}
    setTimeout(()=>{
      videoWrapper.querySelectorAll('.plyr-player').forEach(player=>{
        if(!player.plyr){
          player.plyr=new Plyr(player,{
            controls:['play','progress','current-time','mute','volume','fullscreen'],
            ratio:'16:9',seekTime:5,settings:[]
          });
        }
        player.addEventListener('click',function(e){
          if(e.target.closest('.plyr__controls')||e.target.classList.contains('plyr__control')||e.target.tagName==='BUTTON') return;
          e.stopPropagation();
          if(player.plyr.playing) player.plyr.pause(); else player.plyr.play();
        });
      });
      const accordion=document.querySelector('.legislatie-custom-accordion');
      if(accordion){
        const body=accordion.querySelector('.custom-accordion-body');
        if(body) body.innerHTML=page.content||'';
      }
      initLegislateCustomAccordions();  // <- re-leagă și efectul .is-pressed
      hideLoader();
      if(window.__observeLegislateVideos) window.__observeLegislateVideos();
      section.classList.add('visible');
      section.style.setProperty('display','flex','important');
    },10);
    // Preload următoarea pagină în buffer
    const nextPtr=ptr+1;
    if(nextPtr<pagesIndexes.length){
      const nextIdx=pagesIndexes[nextPtr];
      if(!pageBuffer[nextIdx]){
        db.collection("legislatie_pages")
          .where("chapterSlug","==",chapterId)
          .where("index","==",nextIdx)
          .limit(1).get().then(snap=>{
            if(!snap.empty) pageBuffer[nextIdx]={id:snap.docs[0].id,...snap.docs[0].data()};
          });
      }
    }
    if(ptr<pagesIndexes.length-1){nextBtn.style.display='flex';nextBtn.textContent='CONTINUA';}
    else{nextBtn.style.display='flex';nextBtn.textContent='FINALIZEAZA';}
    if(prevBtn) prevBtn.style.display=(ptr>0)?'flex':'none';
    finalScreen.style.display='none';
  }
  async function goToNext(){
    if(currentPointer<pagesIndexes.length-1){
      saveUserProgress(currentPointer);
      await renderPage(currentPointer+1);
    }else{
      const progressText=`${pad2(pagesIndexes.length)}/${pad2(pagesIndexes.length)}`;
      setChapterProgressUI(chapterTitle||'',progressText);
      if(finalNextBtn){
        if(await isUltimulCapitol()){finalNextBtn.style.display='none';}
        else{finalNextBtn.style.display='flex';}
      }
      section.classList.remove('visible');
      section.style.display='none';
      finalScreen.style.display='flex';
      window._chapterFinalized=true;
      saveUserProgress('done');
      // procent & bară pe FINAL din date locale
      showChapterProgressFinalLocal({done:true,pagePointer:pagesIndexes.length-1});
    }
  }
  async function goToPrev(){ if(currentPointer>0) await renderPage(currentPointer-1); }
  async function loadUserProgressAndIndexes(){
    showLoader();
    section.classList.remove('visible');
    section.style.display='none';
    finalScreen.style.display='none';
    const chapterSnap=await db.collection("legislatie_chapters").doc(chapterId).get();
    if(!chapterSnap.exists){renderNoPages();return;}
    const chapterData=chapterSnap.data();
    chapterTitle=chapterData.title||chapterId;
    pagesIndexes=Array.isArray(chapterData.pagesIndexes)?chapterData.pagesIndexes.slice():[];
    if(!pagesIndexes.length){
      const snap=await db.collection("legislatie_pages").where("chapterSlug","==",chapterId).get();
      pagesIndexes=[]; snap.forEach(doc=>{const d=doc.data(); if(typeof d.index==="number") pagesIndexes.push(d.index);});
      pagesIndexes.sort((a,b)=>a-b);
    }
    if(!pagesIndexes.length){renderNoPages();return;}
    const progSnap=await db.collection("users").doc(userId).collection("progress_legislatie").doc(chapterId).get();
    let pagePtr=-1; isDone=false;
    if(progSnap.exists){
      const data=progSnap.data();
      if(typeof data.pagePointer==='number') pagePtr=data.pagePointer;
      if(data.done===true) isDone=true;
    }
    if(isDone){
      window._chapterFinalized=true;
      const progressText=`${pad2(pagesIndexes.length)}/${pad2(pagesIndexes.length)}`;
      setChapterProgressUI(chapterTitle||'',progressText);
      if(finalNextBtn){
        if(await isUltimulCapitol()){finalNextBtn.style.display='none';}
        else{finalNextBtn.style.display='flex';}
      }
      section.classList.remove('visible');
      section.style.display='none';
      finalScreen.style.display='flex';
      hideLoader();
      // procent & bară pe FINAL calculat local
      showChapterProgressFinalLocal({done:true,pagePointer:pagesIndexes.length-1});
    }else{
      window._chapterFinalized=false;
      section.style.display='flex';
      await renderPage(Math.max(0,Math.min(pagePtr+1,pagesIndexes.length-1)));
    }
  }
  nextBtn.onclick=goToNext;
  if(prevBtn) prevBtn.onclick=goToPrev;
  await loadUserProgressAndIndexes();
  initLegislateVideoViewportAutoPause();
  if(finalNextBtn) finalNextBtn.onclick=async function(){
    const chaptersSnap=await db.collection('legislatie_chapters').orderBy('index').get();
    let chapters=[]; chaptersSnap.forEach(doc=>chapters.push({id:doc.id}));
    const idx=chapters.findIndex(c=>c.id===chapterId);
    if(idx!==-1&&idx<chapters.length-1){
      const nextChapterId=chapters[idx+1].id;
      window.location.replace(`${window.location.pathname}?chapterId=${encodeURIComponent(nextChapterId)}`);
    }else{
      if(finalNextBtn) finalNextBtn.style.display='none';
    }
  };
  if(finalResetBtn&&alertWrapper){ finalResetBtn.onclick=function(){alertWrapper.style.display='flex';}; }
  if(backToFinalScreenBtn&&alertWrapper){ backToFinalScreenBtn.onclick=function(){alertWrapper.style.display='none';finalScreen.style.display='flex';}; }
  if(confirmResetBtn&&alertWrapper){
    confirmResetBtn.onclick=async function(){
      try{
        await db.collection('users').doc(user.uid).collection('progress_legislatie').doc(chapterId).delete();
        window.location.reload();
      }catch(e){
        alert("Eroare la resetarea progresului. Încearcă din nou.");
        alertWrapper.style.display='none';
        finalScreen.style.display='flex';
      }
    };
  }
}); // final Webflow.push
// Forțăm ieșirea la /legislatie pe back
window.addEventListener('popstate',function(){window.location.href='/legislatie';});
</script>
