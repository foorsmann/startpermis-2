  <script>
(function runConfirmEmailPage() {
  const boot = () => {
    'use strict';
    const root = document.documentElement;
    // Anti-dup guard
    if (window.__sp_confirm_email_init__) return;
    window.__sp_confirm_email_init__ = true;
    // In Designer nu vrem anti-flicker / JS
    if (root.classList.contains('wf-design-mode')) {
      root.classList.remove('ev-preload');
      return;
    }
    /* ========== HOOKS DOM ========== */
    const card    = document.querySelector('.email-validation-card');
    const titleEl = document.querySelector('.email-validation-title');
    const textEl  = document.querySelector('.email-validation-text');
    const setTitle = (t) => { if (titleEl) titleEl.textContent = t; };
    const setText  = (t) => { if (textEl)  textEl.textContent  = t; };
    /* ========== FADE (DOAR CAND ARE SENS) ========== */
    const fade = (isFirst) => {
      if (!card) return;
      card.classList.remove('sp-fade-first', 'sp-fade-soft');
      void card.offsetHeight; // restart animation
      card.classList.add(isFirst ? 'sp-fade-first' : 'sp-fade-soft');
    };
    if (card) {
      card.addEventListener('animationend', () => {
        card.classList.remove('sp-fade-first', 'sp-fade-soft');
      });
    }
    const revealFirst = () => {
      // scoatem preload => card devine display:flex (prin CSS)
      root.classList.remove('ev-preload');
      requestAnimationFrame(() => fade(true));
    };
    /* ========== ERRORS ========== */
    const friendlyError = (err) => {
      const code = err && err.code ? String(err.code) : '';
      if (code.includes('expired-action-code'))    return 'Link-ul a expirat. Te rugam cere din nou emailul de confirmare din pagina „Verifica emailul”.';
      if (code.includes('invalid-action-code'))    return 'Link invalid sau deja folosit. Deschide din nou pagina „Verifica emailul” si cere un alt link.';
      if (code.includes('user-disabled'))          return 'Contul este dezactivat. Te rugam contacteaza suportul.';
      if (code.includes('user-not-found'))         return 'Contul nu a fost gasit. Asigura-te ca folosesti ultimul email primit de la noi.';
      if (code.includes('network-request-failed')) return 'Eroare de retea. Verifica internetul si incearca din nou.';
      return 'A aparut o eroare. Te rugam sa revii in tab-ul initial „Verifica emailul” si sa reincerci.';
    };
    const getAuth = () => {
      if (window.firebase && typeof window.firebase.auth === 'function') return window.firebase.auth();
      return null;
    };
    /* ======== PARAMETRI DIN URL ======== */
    const qs      = new URLSearchParams(window.location.search);
    const mode    = qs.get('mode');
    const oobCode = qs.get('oobCode');
    const auth = getAuth();
    if (!auth) {
      setTitle('Eroare');
      setText('Firebase Auth nu este incarcat pe aceasta pagina. Revino in tab-ul cu „Verifica emailul”.');
      revealFirst();
      return;
    }
    // Acceptam DOAR verifyEmail
    if (mode !== 'verifyEmail' || !oobCode) {
      setTitle('Link invalid');
      setText('Parametri lipsa sau link incorect. Deschide din nou pagina „Verifica emailul” si cere un nou email de confirmare.');
      revealFirst();
      return;
    }
    // ✅ Fara stare “Se proceseaza…”: cardul ramane ascuns pana avem rezultat final
    auth.applyActionCode(oobCode)
      .then(() => {
        // Ping catre tab-ul /verifica-email (fara refresh obligatoriu)
        try { localStorage.setItem('sp_email_verified_at', String(Date.now())); } catch (_) {}
        setTitle('Email confirmat');
        setText(
          'Adresa ta de email a fost confirmata cu succes. ' +
          'Te rugam sa revii in tab-ul initial „Verifica emailul”. Daca reincarci acea pagina, ' +
          'vei fi recunoscut ca utilizator verificat si vei putea intra in platforma.'
        );
        revealFirst();
      })
      .catch((err) => {
        setTitle('Nu s-a putut confirma emailul');
        setText(friendlyError(err));
        revealFirst();
      });
  };
  // Rulam dupa Webflow, cu fallback
  if (window.Webflow && Array.isArray(window.Webflow)) window.Webflow.push(boot);
  else if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
