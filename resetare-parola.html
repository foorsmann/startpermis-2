  <script>
(function runResetPasswordPage() {
  const boot = () => {
    'use strict';
    const root = document.documentElement;
    if (window.__sp_reset_pw_init__) return;
    window.__sp_reset_pw_init__ = true;
    if (root.classList.contains('wf-design-mode')) {
      root.classList.remove('ev-preload');
      return;
    }
    /* ========== DOM HOOKS ========== */
    const cardEl  = document.querySelector('.password-reset-card');
    const titleEl = document.querySelector('.email-validation-title');
    const textEl  = document.querySelector('.email-validation-text');
    const formEl = document.querySelector('.reset-password-form');
    const formBlockEl = formEl ? (formEl.closest('.w-form') || formEl.parentElement) : null;
    const pass1El  = document.querySelector('.reset-pass-1') || document.getElementById('Password-1');
    const pass2El  = document.querySelector('.reset-pass-2') || document.getElementById('Password-2');
    const submitEl = document.querySelector('.reset-pass-submit') || (formEl ? formEl.querySelector('[type="submit"]') : null);
    const setTitle = (t) => { if (titleEl) titleEl.textContent = t; };
    const setText  = (t) => { if (textEl)  textEl.textContent  = t; };
    const hideEl = (el) => { if (el) el.style.display = 'none'; };
    const showEl = (el, displayValue = 'block') => { if (el) el.style.display = displayValue; };
    const showFormBlock = (yes) => {
      if (!formBlockEl) return;
      if (!yes) return hideEl(formBlockEl);
      showEl(formBlockEl, 'block');
    };
    /* ========== FADE (DOAR CAND ARE SENS) ========== */
    const fade = (isFirst) => {
      if (!cardEl) return;
      cardEl.classList.remove('sp-fade-first', 'sp-fade-soft');
      void cardEl.offsetHeight;
      cardEl.classList.add(isFirst ? 'sp-fade-first' : 'sp-fade-soft');
    };
    if (cardEl) {
      cardEl.addEventListener('animationend', () => {
        cardEl.classList.remove('sp-fade-first', 'sp-fade-soft');
      });
    }
    const revealFirst = () => {
      root.classList.remove('ev-preload');
      requestAnimationFrame(() => fade(true));
    };
    const fadeMajor = () => requestAnimationFrame(() => fade(false)); // doar pt schimbari mari (ex: succes)
    /* ========== ERRORS ========== */
    const friendlyError = (err) => {
      const code = err && err.code ? String(err.code) : '';
      if (code.includes('expired-action-code'))    return 'Link-ul a expirat. Te rugam cere din nou resetarea parolei din pagina initiala.';
      if (code.includes('invalid-action-code'))    return 'Link invalid sau deja folosit. Te rugam cere din nou resetarea parolei din pagina initiala.';
      if (code.includes('user-disabled'))          return 'Contul este dezactivat. Te rugam contacteaza suportul.';
      if (code.includes('user-not-found'))         return 'Contul nu a fost gasit.';
      if (code.includes('password-does-not-meet-requirements') || code.includes('weak-password'))
        return 'Parola nu respecta cerintele (minim 8 caractere).';
      if (code.includes('network-request-failed')) return 'Eroare de retea. Verifica internetul si incearca din nou.';
      return 'A aparut o eroare. Te rugam incearca din nou.';
    };
    const getAuth = () => {
      if (window.firebase && typeof window.firebase.auth === 'function') return window.firebase.auth();
      return null;
    };
    const setBusy = (busy) => {
      // optional, bun pt accesibilitate: indica “se lucreaza” fara texte de tranzitie
      if (cardEl) cardEl.setAttribute('aria-busy', busy ? 'true' : 'false');
      if (submitEl) {
        submitEl.disabled = !!busy;
        submitEl.style.opacity = busy ? '0.7' : '';
      }
    };
    /* ========== PARAMS ========== */
    const qs = new URLSearchParams(window.location.search);
    const mode = qs.get('mode');
    const oobCode = qs.get('oobCode');
    /* ========== FLOW ========== */
    const auth = getAuth();
    if (!auth) {
      setTitle('Eroare');
      setText('Firebase Auth nu este incarcat pe aceasta pagina. Revino in pagina initiala si reincearca.');
      showFormBlock(false);
      revealFirst();
      return;
    }
    if (mode !== 'resetPassword' || !oobCode) {
      setTitle('Link invalid');
      setText('Parametri lipsa. Deschide link-ul complet primit pe email si reincearca.');
      showFormBlock(false);
      revealFirst();
      return;
    }
    // Pana verifica oobCode, cardul ramane complet ascuns (fara “Se proceseaza…”)
    auth.verifyPasswordResetCode(oobCode)
      .then((email) => {
        showFormBlock(true);
        setTitle('Resetare parola');
        setText(`Seteaza o parola noua pentru ${email}.`);
        if (pass1El) pass1El.setAttribute('autocomplete', 'new-password');
        if (pass2El) pass2El.setAttribute('autocomplete', 'new-password');
        revealFirst();
        if (!formEl) return;
        formEl.addEventListener('submit', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          const p1 = (pass1El && pass1El.value ? pass1El.value.trim() : '');
          const p2 = (pass2El && pass2El.value ? pass2El.value.trim() : '');
          // ✅ Validare locala aliniata cu policy (minim 8)
          if (p1.length < 8) {
            setTitle('Parola prea scurta');
            setText('Foloseste minim 8 caractere.');
            return;
          }
          if (p1 !== p2) {
            setTitle('Parolele nu coincid');
            setText('Te rugam sa introduci aceeasi parola in ambele campuri.');
            return;
          }
          // ✅ fara fade la click: doar blocam dublu-submit
          setBusy(true);
          try {
            await auth.confirmPasswordReset(oobCode, p1);
            // ✅ Schimbare MAJORA: dispare form-ul -> pastram un fade soft aici
            showFormBlock(false);
            setTitle('Parola a fost setata');
            setText(
              'Parola ta a fost schimbata cu succes. ' +
              'Te rugam sa revii in pagina initiala (tab-ul din care ai pornit resetarea) si sa te autentifici acolo. ' +
              'Poti inchide aceasta pagina.'
            );
            fadeMajor();
          } catch (err) {
            // ✅ Fara fade: mesaj + retry
            setTitle('Nu s-a putut seta parola');
            setText(friendlyError(err));
          } finally {
            setBusy(false);
          }
        }, true);
      })
      .catch((err) => {
        showFormBlock(false);
        setTitle('Link invalid');
        setText(friendlyError(err));
        revealFirst();
      });
  };
  if (window.Webflow && Array.isArray(window.Webflow)) window.Webflow.push(boot);
  else if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
