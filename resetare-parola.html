  <script>
(function () {

    '/auth': true,
    '/confirmare-email': true,
    '/resetare-parola': true,
    '/verifica-email': true
  };
  var VERIFY_URL = '/verifica-email';
  var SNAP_KEY   = 'sp_auth_snapshot_v1';
  function showPage(){
    root.classList.remove('sp-auth-preload');
  }
  function writeSnap(obj){
    try { localStorage.setItem(SNAP_KEY, JSON.stringify(obj)); } catch(e){}
  }
  function snapAnon(){
    writeSnap({ a:0, ev:0, uid:'', t:Date.now() });
  }
  function snapUser(user){
    writeSnap({
      a:1,
      uid: String(user && user.uid || ''),
      ev: (user && user.emailVerified) ? 1 : 0,
      t: Date.now()
    });
  }
  function redirectToVerify(){
    try { sessionStorage.setItem('sp_return_after_verify', location.pathname + location.search + location.hash); } catch(e){}
    // păstrăm ascuns (fără flicker) și trimitem direct la verifica-email
    root.classList.add('sp-auth-preload');
    location.replace(VERIFY_URL);
  }
  // fail-safe: dacă Firebase nu pornește, nu lăsăm ecran gol
  var failSafe = setTimeout(showPage, 12000);
  function waitForAuth(timeoutMs){
    return new Promise(function(resolve, reject){
      var t0 = Date.now();
      (function tick(){
        var ok = window.firebase && typeof window.firebase.auth === 'function';
        if (ok) return resolve(window.firebase.auth());
        if (Date.now() - t0 > timeoutMs) return reject(new Error('auth-timeout'));
        setTimeout(tick, 50);
      })();
    });
  }
  waitForAuth(8000).then(function(auth){
    auth.onAuthStateChanged(function(user){
      clearTimeout(failSafe);
      // anon -> allow page, snapshot ANON
      if (!user) {
        snapAnon();
        showPage();
        return;
      }
      // logged -> snapshot + logic
      snapUser(user);
      // verified -> allow
      if (user.emailVerified) {
        showPage();
        return;
      }
      // unverified -> redirect everywhere, except exempt pages
      if (!EXEMPT_REDIRECT[path]) {
        redirectToVerify();
        return;
      }

      showPage();
    });

    clearTimeout(failSafe);
    showPage();
  });

  <!--  ======= Helper global: single-active lock (LAST-OPEN WINS, via chapterLocks) =======  -->
  <script>
(function () {
  function sanitizeKey(k){ return String(k||"global").replace(/[.#$\[\]\/]/g,"-"); }
  window.installSingleActiveLock = function installSingleActiveLock(opts){
    const { lockKey, redirectUrl, userId, redirectDelayMs = 0 } = (opts||{});
    if (!firebase || !firebase.database) { console.warn("[lock] RTDB indisponibil."); return; }
    if (!lockKey || !redirectUrl) { console.warn("[lock] lockKey/redirectUrl lipsă."); return; }
    const auth = firebase.auth();
    const userReady = userId
      ? Promise.resolve({ uid:userId })
      : (auth.currentUser ? Promise.resolve(auth.currentUser)
                          : new Promise(res => auth.onAuthStateChanged(res)));
    userReady.then(user=>{
      if(!user||!user.uid){ console.warn("[lock] user nelogat; aplicăm lock-ul după login."); return; }
      const db = firebase.database();
      const SID = (crypto.randomUUID?.() || (Math.random().toString(36).slice(2)+"-"+Date.now()));
      const key = sanitizeKey(lockKey);
      const lockRef = db.ref("chapterLocks").child(user.uid).child(key);
      function claim(){
        try{
          lockRef.set({ uid:user.uid, sessionId:SID, ts: firebase.database.ServerValue.TIMESTAMP });
          try{ lockRef.onDisconnect().remove(); }catch(_){}
        }catch(e){ console.warn("[lock] set failed:", e); }
      }
      function kick(){
        setTimeout(()=>{ location.replace(redirectUrl); }, redirectDelayMs);
      }
      lockRef.on("value", snap=>{
        const v = snap.val();
        if(!v){ if(!document.hidden) claim(); return; }
        if(v.sessionId !== SID) kick();
      });
      document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) claim(); }, {passive:true});
      window.addEventListener("focus", claim, {passive:true});
      window.addEventListener("beforeunload", ()=>{ try{ lockRef.remove(); }catch(_){}});
      claim();
    });
  };
  window.installSingleActiveLock.version = "v2:chapterLocks";
  console.log("[lock] helper ready:", window.installSingleActiveLock.version);
})();
</script>

  <script>
  (function () {
    const STORAGE_KEY = 'sp-theme';
    const root = document.documentElement;
    const toggles = document.querySelectorAll('.theme-checkbox');
    function getInitialTheme() {
      let saved = null;
      try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
      if (saved === 'light' || saved === 'dark') return saved;
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
      return 'light';
    }
    function setTheme(theme) {
      if (theme !== 'light' && theme !== 'dark') theme = 'light';
      root.setAttribute('data-theme', theme);
      try { localStorage.setItem(STORAGE_KEY, theme); } catch (e) {}
      const isDark = theme === 'dark';
      toggles.forEach(function (cb) { cb.checked = isDark; });
      return theme;
    }
    setTheme(getInitialTheme());
    requestAnimationFrame(function () {
      if (document.body) document.body.classList.add('theme-ready');
    });
    if (!toggles.length) return;
    toggles.forEach(function (cb) {
      cb.addEventListener('change', function (e) {
        const newTheme = e.target.checked ? 'dark' : 'light';
        setTheme(newTheme);
      });
    });
  })();

    const pass1El  = document.querySelector('.reset-pass-1') || document.getElementById('Password-1');
    const pass2El  = document.querySelector('.reset-pass-2') || document.getElementById('Password-2');
    const submitEl = document.querySelector('.reset-pass-submit') || (formEl ? formEl.querySelector('[type="submit"]') : null);
    const setTitle = (t) => { if (titleEl) titleEl.textContent = t; };
    const setText  = (t) => { if (textEl)  textEl.textContent  = t; };
    const hideEl = (el) => { if (el) el.style.display = 'none'; };
    const showEl = (el, displayValue = 'block') => { if (el) el.style.display = displayValue; };
    const showFormBlock = (yes) => {
      if (!formBlockEl) return;
      if (!yes) return hideEl(formBlockEl);
      showEl(formBlockEl, 'block');
    };
    /* ========== FADE (DOAR CAND ARE SENS) ========== */
    const fade = (isFirst) => {
      if (!cardEl) return;
      cardEl.classList.remove('sp-fade-first', 'sp-fade-soft');
      void cardEl.offsetHeight;
      cardEl.classList.add(isFirst ? 'sp-fade-first' : 'sp-fade-soft');
    };
    if (cardEl) {
      cardEl.addEventListener('animationend', () => {
        cardEl.classList.remove('sp-fade-first', 'sp-fade-soft');
      });
    }
    const revealFirst = () => {
      root.classList.remove('ev-preload');
      requestAnimationFrame(() => fade(true));
    };
    const fadeMajor = () => requestAnimationFrame(() => fade(false)); // doar pt schimbari mari (ex: succes)
    /* ========== ERRORS ========== */
    const friendlyError = (err) => {
      const code = err && err.code ? String(err.code) : '';
      if (code.includes('expired-action-code'))    return 'Link-ul a expirat. Te rugam cere din nou resetarea parolei din pagina initiala.';
      if (code.includes('invalid-action-code'))    return 'Link invalid sau deja folosit. Te rugam cere din nou resetarea parolei din pagina initiala.';
      if (code.includes('user-disabled'))          return 'Contul este dezactivat. Te rugam contacteaza suportul.';
      if (code.includes('user-not-found'))         return 'Contul nu a fost gasit.';
      if (code.includes('password-does-not-meet-requirements') || code.includes('weak-password'))
        return 'Parola nu respecta cerintele (minim 8 caractere).';
      if (code.includes('network-request-failed')) return 'Eroare de retea. Verifica internetul si incearca din nou.';
      return 'A aparut o eroare. Te rugam incearca din nou.';
    };
    const getAuth = () => {
      if (window.firebase && typeof window.firebase.auth === 'function') return window.firebase.auth();
      return null;
    };
    const setBusy = (busy) => {
      // optional, bun pt accesibilitate: indica “se lucreaza” fara texte de tranzitie
      if (cardEl) cardEl.setAttribute('aria-busy', busy ? 'true' : 'false');
      if (submitEl) {
        submitEl.disabled = !!busy;
        submitEl.style.opacity = busy ? '0.7' : '';
      }
    };
    /* ========== PARAMS ========== */
    const qs = new URLSearchParams(window.location.search);
    const mode = qs.get('mode');
    const oobCode = qs.get('oobCode');
    /* ========== FLOW ========== */
    const auth = getAuth();
    if (!auth) {
      setTitle('Eroare');
      setText('Firebase Auth nu este incarcat pe aceasta pagina. Revino in pagina initiala si reincearca.');
      showFormBlock(false);
      revealFirst();
      return;
    }
    if (mode !== 'resetPassword' || !oobCode) {
      setTitle('Link invalid');
      setText('Parametri lipsa. Deschide link-ul complet primit pe email si reincearca.');
      showFormBlock(false);
      revealFirst();
      return;
    }
    // Pana verifica oobCode, cardul ramane complet ascuns (fara “Se proceseaza…”)
    auth.verifyPasswordResetCode(oobCode)
      .then((email) => {
        showFormBlock(true);
        setTitle('Resetare parola');
        setText(`Seteaza o parola noua pentru ${email}.`);
        if (pass1El) pass1El.setAttribute('autocomplete', 'new-password');
        if (pass2El) pass2El.setAttribute('autocomplete', 'new-password');
        revealFirst();
        if (!formEl) return;
        formEl.addEventListener('submit', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          const p1 = (pass1El && pass1El.value ? pass1El.value.trim() : '');
          const p2 = (pass2El && pass2El.value ? pass2El.value.trim() : '');
          // ✅ Validare locala aliniata cu policy (minim 8)
          if (p1.length < 8) {
            setTitle('Parola prea scurta');
            setText('Foloseste minim 8 caractere.');
            return;
          }
          if (p1 !== p2) {
            setTitle('Parolele nu coincid');
            setText('Te rugam sa introduci aceeasi parola in ambele campuri.');
            return;
          }
          // ✅ fara fade la click: doar blocam dublu-submit
          setBusy(true);
          try {
            await auth.confirmPasswordReset(oobCode, p1);
            // ✅ Schimbare MAJORA: dispare form-ul -> pastram un fade soft aici
            showFormBlock(false);
            setTitle('Parola a fost setata');
            setText(
              'Parola ta a fost schimbata cu succes. ' +
              'Te rugam sa revii in pagina initiala (tab-ul din care ai pornit resetarea) si sa te autentifici acolo. ' +
              'Poti inchide aceasta pagina.'
            );
            fadeMajor();
          } catch (err) {
            // ✅ Fara fade: mesaj + retry
            setTitle('Nu s-a putut seta parola');
            setText(friendlyError(err));
          } finally {
            setBusy(false);
          }
        }, true);
      })
      .catch((err) => {
        showFormBlock(false);
        setTitle('Link invalid');
        setText(friendlyError(err));
        revealFirst();
      });
  };
  if (window.Webflow && Array.isArray(window.Webflow)) window.Webflow.push(boot);
  else if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
