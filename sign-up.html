  <!--  ✅ GLOBAL AUTH GUARD (FOOTER) — PRO: update snapshot + redirect unverified fără reload  -->
  <script>
(function () {
  'use strict';
  var root = document.documentElement;
  if (root.classList.contains('wf-design-mode')) return;
  function normPath(p){
    p = String(p || '/');
    p = p.split('?')[0].split('#')[0];
    p = p.replace(/\/+$/, '');
    return p || '/';
  }
  var path = normPath(location.pathname);
  // ✅ excepții: NU redirectăm de aici (dar putem actualiza snapshot)
  var EXEMPT_REDIRECT = {
    '/auth': true,
    '/confirmare-email': true,
    '/resetare-parola': true,
    '/verifica-email': true
  };
  var VERIFY_URL = '/verifica-email';
  var SNAP_KEY   = 'sp_auth_snapshot_v1';
  function showPage(){
    root.classList.remove('sp-auth-preload');
  }
  function writeSnap(obj){
    try { localStorage.setItem(SNAP_KEY, JSON.stringify(obj)); } catch(e){}
  }
  function snapAnon(){
    writeSnap({ a:0, ev:0, uid:'', t:Date.now() });
  }
  function snapUser(user){
    writeSnap({
      a:1,
      uid: String(user && user.uid || ''),
      ev: (user && user.emailVerified) ? 1 : 0,
      t: Date.now()
    });
  }
  function redirectToVerify(){
    try { sessionStorage.setItem('sp_return_after_verify', location.pathname + location.search + location.hash); } catch(e){}
    // păstrăm ascuns (fără flicker) și trimitem direct la verifica-email
    root.classList.add('sp-auth-preload');
    location.replace(VERIFY_URL);
  }
  // fail-safe: dacă Firebase nu pornește, nu lăsăm ecran gol
  var failSafe = setTimeout(showPage, 12000);
  function waitForAuth(timeoutMs){
    return new Promise(function(resolve, reject){
      var t0 = Date.now();
      (function tick(){
        var ok = window.firebase && typeof window.firebase.auth === 'function';
        if (ok) return resolve(window.firebase.auth());
        if (Date.now() - t0 > timeoutMs) return reject(new Error('auth-timeout'));
        setTimeout(tick, 50);
      })();
    });
  }
  waitForAuth(8000).then(function(auth){
    auth.onAuthStateChanged(function(user){
      clearTimeout(failSafe);
      // anon -> allow page, snapshot ANON
      if (!user) {
        snapAnon();
        showPage();
        return;
      }
      // logged -> snapshot + logic
      snapUser(user);
      // verified -> allow
      if (user.emailVerified) {
        showPage();
        return;
      }
      // unverified -> redirect everywhere, except exempt pages
      if (!EXEMPT_REDIRECT[path]) {
        redirectToVerify();
        return;
      }
      // pe pagini exceptate (auth/reset/confirm/verifica-email) NU redirectăm
      showPage();
    });
  }).catch(function(){
    clearTimeout(failSafe);
    showPage();
  });
})();
</script>
  <!--  ======= Helper global: single-active lock (LAST-OPEN WINS, via chapterLocks) =======  -->
  <script>
(function () {
  function sanitizeKey(k){ return String(k||"global").replace(/[.#$\[\]\/]/g,"-"); }
  window.installSingleActiveLock = function installSingleActiveLock(opts){
    const { lockKey, redirectUrl, userId, redirectDelayMs = 0 } = (opts||{});
    if (!firebase || !firebase.database) { console.warn("[lock] RTDB indisponibil."); return; }
    if (!lockKey || !redirectUrl) { console.warn("[lock] lockKey/redirectUrl lipsă."); return; }
    const auth = firebase.auth();
    const userReady = userId
      ? Promise.resolve({ uid:userId })
      : (auth.currentUser ? Promise.resolve(auth.currentUser)
                          : new Promise(res => auth.onAuthStateChanged(res)));
    userReady.then(user=>{
      if(!user||!user.uid){ console.warn("[lock] user nelogat; aplicăm lock-ul după login."); return; }
      const db = firebase.database();
      const SID = (crypto.randomUUID?.() || (Math.random().toString(36).slice(2)+"-"+Date.now()));
      const key = sanitizeKey(lockKey);
      const lockRef = db.ref("chapterLocks").child(user.uid).child(key);
      function claim(){
        try{
          lockRef.set({ uid:user.uid, sessionId:SID, ts: firebase.database.ServerValue.TIMESTAMP });
          try{ lockRef.onDisconnect().remove(); }catch(_){}
        }catch(e){ console.warn("[lock] set failed:", e); }
      }
      function kick(){
        setTimeout(()=>{ location.replace(redirectUrl); }, redirectDelayMs);
      }
      lockRef.on("value", snap=>{
        const v = snap.val();
        if(!v){ if(!document.hidden) claim(); return; }
        if(v.sessionId !== SID) kick();
      });
      document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) claim(); }, {passive:true});
      window.addEventListener("focus", claim, {passive:true});
      window.addEventListener("beforeunload", ()=>{ try{ lockRef.remove(); }catch(_){}});
      claim();
    });
  };
  window.installSingleActiveLock.version = "v2:chapterLocks";
  console.log("[lock] helper ready:", window.installSingleActiveLock.version);
})();
</script>

      ui.clearGlobalError('init');
    });
    /* ===================== GOOGLE CLICK (capturing) ===================== */
    document.addEventListener('click', async function(e){
      var btn = e.target && e.target.closest ? e.target.closest('[data-google-btn]') : null;
      if (!btn) return;
      var wrapper = btn.closest('[data-ms-form]');
      if (!wrapper) return;
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      var ui  = getUI(wrapper);
      var els = getEls(wrapper);
      if (btn.tagName === 'BUTTON') btn.setAttribute('type','button');
      ui.clearGlobalError('google click');
      clearFieldErrors(wrapper);
      if (els.termsEl && !els.termsEl.checked) {
        markInputInvalid(els.termsEl);
        ui.setGlobalError(TXT.needTerms);
        if (!isTouchLike()){
          try{ els.termsEl.focus({ preventScroll:true }); }catch(_){ try{ els.termsEl.focus(); }catch(__){} }
        }
        return;
      }
      if (btn.dataset.msBusy === '1') return;
      btn.dataset.msBusy = '1';
      lock(btn, true);
      var consentPayload = buildConsentFromEls(els);
      if (!_persistReady) ensurePersistence();
      var provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      if (shouldUseRedirect) {
        try { sessionStorage.setItem(GOOGLE_CONSENT_KEY, JSON.stringify(consentPayload)); } catch(_){}
        try{
          dlog('Google: redirect...');
          await auth.signInWithRedirect(provider);
          return;
        }catch(err){
          lock(btn, false);
          btn.dataset.msBusy = '';
          try { sessionStorage.removeItem(GOOGLE_CONSENT_KEY); } catch(_){}
          ui.setGlobalError(mapGoogleError(err));
          if (DEBUG && err) dwarn('Google redirect error:', err.code, err);
          return;
        }
      }
      var willNavigate = false;
      try{
        dlog('Google: popup...');
        var cred = await auth.signInWithPopup(provider);
        var isNew = !!(cred.additionalUserInfo && cred.additionalUserInfo.isNewUser);
        try{
          await afterAuth(cred.user, isNew, consentPayload);
        }catch(err2){
          dwarn('afterAuth popup failed:', err2);
          ui.setGlobalError(TXT.saveProfileFail);
          return;
        }
        await refreshUserState(cred.user);
        if (cred.user && !cred.user.emailVerified) {
          setVerifyEmailHint();
          willNavigate = true;
          dlog('redirect (google popup) ->', VERIFY_PAGE);
          location.href = VERIFY_PAGE;
          return;
        }
        willNavigate = true;
        dlog('redirect (google popup) ->', REDIRECT_AFTER);
        location.href = REDIRECT_AFTER;
      }catch(err){
        ui.setGlobalError(mapGoogleError(err));
        if (DEBUG && err) dwarn('Google popup error:', err.code, err);
      }finally{
        if (!willNavigate) lock(btn, false);
        btn.dataset.msBusy = '';
      }
    }, true);
    /* ===================== SUBMIT SIGNUP (capturing) ===================== */
    document.addEventListener('submit', async function(e){
      var form = e.target;
      if (!(form instanceof HTMLFormElement)) return;
      var wrapper = form.closest('[data-ms-form]');
      if (!wrapper) return;
      var ui  = getUI(wrapper);
      var els = getEls(wrapper);
      disableNativeValidation(wrapper);
      applyInputHints(wrapper);
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      ui.clearGlobalError('submit start');
      clearFieldErrors(wrapper);
      if (!els.emailEl || !els.passEl){
        ui.setGlobalError('Lipsesc campurile din formular.');
        return;
      }
      var email = (els.emailEl.value || '').trim();
      var pass  = (els.passEl.value  || '').trim();
      var hasClientError = false;
      if (!email){ markInputInvalid(els.emailEl); hasClientError = true; }
      if (!pass){  markInputInvalid(els.passEl);  hasClientError = true; }
      var termsMissing = (els.termsEl && !els.termsEl.checked);
      if (termsMissing) {
        markInputInvalid(els.termsEl);
        hasClientError = true;
      }
      if (pass && pass.length < MIN_PASS_LEN) {
        markInputInvalid(els.passEl);
        ui.setGlobalError(TXT.weakPass);
        ui.focusFirstInvalid();
        return;
      }
      if (hasClientError){
        var onlyTerms = termsMissing && !!email && !!pass;
        ui.setGlobalError(onlyTerms ? TXT.needTerms : TXT.fillAll);
        ui.focusFirstInvalid();
        return;
      }
      var consentPayload = buildConsentFromEls(els);
      lock(els.submitBtn, true);
      var unlockNeeded = true;
      try{
        await ensurePersistence();
        dlog('submit: createUserWithEmailAndPassword...');
        var cred = await auth.createUserWithEmailAndPassword(email, pass);
        try{
          await afterAuth(cred.user, true, consentPayload);
        }catch(err2){
          dwarn('afterAuth email/pass failed:', err2);
          ui.setGlobalError(TXT.saveProfileFail);
          ui.focusFirstInvalid();
          return;
        }
        setVerifyEmailHint();
        unlockNeeded = false;
        dlog('redirect (email/pass) ->', VERIFY_PAGE);
        location.href = VERIFY_PAGE;
      }catch(err){
        var code = (err && err.code) || '';
        if (DEBUG && err) dwarn('submit error:', code, err);
        if (code === 'auth/invalid-email' || code === 'auth/email-already-in-use') {
          markInputInvalid(els.emailEl);
        }
        if (code === 'auth/weak-password' || code === 'auth/password-does-not-meet-requirements') {
          markInputInvalid(els.passEl);
        }
        ui.setGlobalError(mapSignupError(err));
        ui.focusFirstInvalid();
      }finally{
        if (unlockNeeded) lock(els.submitBtn, false);
      }
    }, true);
  }); // boot()
})();
</script>
</body>
</html>
