  var VERIFY_URL = '/verifica-email';

  var SNAP_KEY = 'sp_auth_snapshot_v1';
  // TTL-uri (poți ajusta)
  var TTL_VERIFIED_MS   = 24 * 60 * 60 * 1000; // 24h
  var TTL_ANON_MS       = 24 * 60 * 60 * 1000; // 24h
  var TTL_UNVERIFIED_MS = 10 * 60 * 1000;      // 10 min
  function readSnap(){
    try {
      var raw = localStorage.getItem(SNAP_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch(e) { return null; }
  }
  function isFresh(s){
    if (!s || !s.t) return false;
    var age = Date.now() - Number(s.t || 0);
    if (!isFinite(age) || age < 0) return false;
    // s.a = 1 (logged), 0 (anon)
    // s.ev = 1 (verified), 0 (unverified)
    if (s.a === 0) return age <= TTL_ANON_MS;
    if (s.a === 1 && s.ev === 1) return age <= TTL_VERIFIED_MS;

  <!--  ✅ GLOBAL AUTH GUARD (FOOTER) — PRO: update snapshot + redirect unverified fără reload  -->
  <script>
(function () {
  'use strict';
  var root = document.documentElement;
  if (root.classList.contains('wf-design-mode')) return;
  function normPath(p){
    p = String(p || '/');
    p = p.split('?')[0].split('#')[0];
    p = p.replace(/\/+$/, '');
    return p || '/';
  }
  var path = normPath(location.pathname);
  // ✅ excepții: NU redirectăm de aici (dar putem actualiza snapshot)
  var EXEMPT_REDIRECT = {
    '/auth': true,
    '/confirmare-email': true,
    '/resetare-parola': true,
    '/verifica-email': true
  };
  var VERIFY_URL = '/verifica-email';
  var SNAP_KEY   = 'sp_auth_snapshot_v1';
  function showPage(){
    root.classList.remove('sp-auth-preload');
  }
  function writeSnap(obj){
    try { localStorage.setItem(SNAP_KEY, JSON.stringify(obj)); } catch(e){}
  }
  function snapAnon(){
    writeSnap({ a:0, ev:0, uid:'', t:Date.now() });
  }
  function snapUser(user){
    writeSnap({
      a:1,
      uid: String(user && user.uid || ''),
      ev: (user && user.emailVerified) ? 1 : 0,
      t: Date.now()
    });
  }
  function redirectToVerify(){
    try { sessionStorage.setItem('sp_return_after_verify', location.pathname + location.search + location.hash); } catch(e){}
    // păstrăm ascuns (fără flicker) și trimitem direct la verifica-email
    root.classList.add('sp-auth-preload');
    location.replace(VERIFY_URL);
  }
  // fail-safe: dacă Firebase nu pornește, nu lăsăm ecran gol
  var failSafe = setTimeout(showPage, 12000);
  function waitForAuth(timeoutMs){
    return new Promise(function(resolve, reject){
      var t0 = Date.now();
      (function tick(){
        var ok = window.firebase && typeof window.firebase.auth === 'function';
        if (ok) return resolve(window.firebase.auth());
        if (Date.now() - t0 > timeoutMs) return reject(new Error('auth-timeout'));
        setTimeout(tick, 50);
      })();
    });
  }
  waitForAuth(8000).then(function(auth){
    auth.onAuthStateChanged(function(user){
      clearTimeout(failSafe);
      // anon -> allow page, snapshot ANON
      if (!user) {
        snapAnon();
        showPage();
        return;
      }
      // logged -> snapshot + logic
      snapUser(user);
      // verified -> allow
      if (user.emailVerified) {
        showPage();
        return;
      }
      // unverified -> redirect everywhere, except exempt pages
      if (!EXEMPT_REDIRECT[path]) {
        redirectToVerify();
        return;
      }
      // pe pagini exceptate (auth/reset/confirm/verifica-email) NU redirectăm
      showPage();
    });
  }).catch(function(){
    clearTimeout(failSafe);
    showPage();
  });
})();
</script>
  <!--  ======= Helper global: single-active lock (LAST-OPEN WINS, via chapterLocks) =======  -->
  <script>
(function () {
  function sanitizeKey(k){ return String(k||"global").replace(/[.#$\[\]\/]/g,"-"); }
  window.installSingleActiveLock = function installSingleActiveLock(opts){
    const { lockKey, redirectUrl, userId, redirectDelayMs = 0 } = (opts||{});
    if (!firebase || !firebase.database) { console.warn("[lock] RTDB indisponibil."); return; }
    if (!lockKey || !redirectUrl) { console.warn("[lock] lockKey/redirectUrl lipsă."); return; }
    const auth = firebase.auth();
    const userReady = userId
      ? Promise.resolve({ uid:userId })
      : (auth.currentUser ? Promise.resolve(auth.currentUser)
                          : new Promise(res => auth.onAuthStateChanged(res)));
    userReady.then(user=>{
      if(!user||!user.uid){ console.warn("[lock] user nelogat; aplicăm lock-ul după login."); return; }
      const db = firebase.database();
      const SID = (crypto.randomUUID?.() || (Math.random().toString(36).slice(2)+"-"+Date.now()));
      const key = sanitizeKey(lockKey);
      const lockRef = db.ref("chapterLocks").child(user.uid).child(key);
      function claim(){
        try{
          lockRef.set({ uid:user.uid, sessionId:SID, ts: firebase.database.ServerValue.TIMESTAMP });
          try{ lockRef.onDisconnect().remove(); }catch(_){}
        }catch(e){ console.warn("[lock] set failed:", e); }
      }
      function kick(){
        setTimeout(()=>{ location.replace(redirectUrl); }, redirectDelayMs);
      }
      lockRef.on("value", snap=>{
        const v = snap.val();
        if(!v){ if(!document.hidden) claim(); return; }
        if(v.sessionId !== SID) kick();
      });
      document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) claim(); }, {passive:true});
      window.addEventListener("focus", claim, {passive:true});
      window.addEventListener("beforeunload", ()=>{ try{ lockRef.remove(); }catch(_){}});
      claim();
    });
  };
  window.installSingleActiveLock.version = "v2:chapterLocks";
  console.log("[lock] helper ready:", window.installSingleActiveLock.version);
})();
</script>

  <script>
  (function () {
    const STORAGE_KEY = 'sp-theme';
    const root = document.documentElement;
    const toggles = document.querySelectorAll('.theme-checkbox');
    function getInitialTheme() {
      let saved = null;
      try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
      if (saved === 'light' || saved === 'dark') return saved;
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
      return 'light';
    }
    function setTheme(theme) {
      if (theme !== 'light' && theme !== 'dark') theme = 'light';
      root.setAttribute('data-theme', theme);
      try { localStorage.setItem(STORAGE_KEY, theme); } catch (e) {}
      const isDark = theme === 'dark';
      toggles.forEach(function (cb) { cb.checked = isDark; });
      return theme;
    }
    setTheme(getInitialTheme());
    requestAnimationFrame(function () {
      if (document.body) document.body.classList.add('theme-ready');
    });
    if (!toggles.length) return;
    toggles.forEach(function (cb) {
      cb.addEventListener('change', function (e) {
        const newTheme = e.target.checked ? 'dark' : 'light';
        setTheme(newTheme);
      });
    });
  })();
</script>
