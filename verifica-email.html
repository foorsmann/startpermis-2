  <script>
(function runVerifyEmailPage() {
  const boot = () => {
    'use strict';
    const root = document.documentElement;
    // In Designer nu rulam nimic
    if (root.classList.contains('wf-design-mode')) {
      root.classList.remove('ev-preload');
      return;
    }
    // Anti dublu-init
    if (window.__sp_verify_email_init__) return;
    window.__sp_verify_email_init__ = true;
    /* ========================== CONFIG ========================== */
    const DEFAULT_AFTER = '/';
    const VERIFY_PAGE   = '/verifica-email';
    const RETURN_KEY = 'sp_return_after_verify';
    const SNAP_KEY   = 'sp_auth_snapshot_v1';
    // 🔒 RTDB root path
    const RTDB_ROOT_PATH = 'emailVerification';
    // ✅ Auto-send doar imediat dupa creare (respecta “doar dupa signup”)
    const AUTO_SEND_ONLY_WHEN_NEW_MS = 10 * 60 * 1000; // 10 minute
    // ✅ Dupa verificare: home (recomandat)
    const AFTER_VERIFY_MODE = 'home'; // 'home' sau 'return' (optional)
    const VERIFY_CONTINUE_URL = window.location.origin + VERIFY_PAGE;
    const actionCodeSettings = { url: VERIFY_CONTINUE_URL, handleCodeInApp: false };
    const STORAGE_VERIFIED_PING = 'sp_email_verified_at';
    // ✅ Throttle server-side (cross-device) pentru “Retrimite email”
    const MANUAL_BURST_MAX = 3;
    const MANUAL_WINDOW_MS = 15_000;
    const ACTIVE_POLL_WINDOW_MS = 3 * 60 * 1000;
    const POLL_START_DELAY_MS   = 1500;
    const POLL_FACTOR           = 1.6;
    const POLL_MAX_DELAY_MS     = 15_000;
    const LOGOUT_MESSAGE_DELAY_MS = 1200;
    /* ======================= DOM HOOKS ======================= */
    const cardEl   = document.querySelector('.email-verification-card');
    const msgEl     = document.querySelector('[data-verify-msg]') || document.querySelector('.email-verification-text');
    const resendBtn = document.querySelector('[data-resend-verify]') || document.querySelector('.resend-verify-btn');
    const checkBtn  = document.querySelector('[data-check-verify]')  || document.querySelector('.check-verify-btn');
    const closeBtn  = document.querySelector('.back-btn-verification-email');
    const btnWrap =
      document.querySelector('.email-verification-btn-wrapper') ||
      (resendBtn ? resendBtn.closest('.email-verification-btn-wrapper') : null) ||
      (resendBtn ? resendBtn.parentElement : null);
    /* ======================= FADE helpers ======================= */
    let revealedOnce = false;
    let lastState = null; // null | 'in' | 'out'
    const fade = (isFirst) => {
      if (!cardEl) return;
      cardEl.classList.remove('sp-fade-first', 'sp-fade-soft');
      void cardEl.offsetHeight;
      cardEl.classList.add(isFirst ? 'sp-fade-first' : 'sp-fade-soft');
    };
    if (cardEl) {
      cardEl.addEventListener('animationend', () => {
        cardEl.classList.remove('sp-fade-first', 'sp-fade-soft');
      });
    }
    const revealFirst = () => {
      if (revealedOnce) return;
      revealedOnce = true;
      root.classList.remove('ev-preload');
      requestAnimationFrame(() => fade(true));
    };
    const fadeMajor = () => {
      if (!revealedOnce) return revealFirst();
      requestAnimationFrame(() => fade(false));
    };
    /* ======================= UI helpers ======================= */
    const setMsg = (text, type) => {
      if (!msgEl) return;
      msgEl.textContent = text || '';
      if (type === 'ok') msgEl.style.color = '#19c37d';
      else if (type === 'err') msgEl.style.color = '#ff5a5f';
      else msgEl.style.color = '';
    };
    const showBtnArea = (show) => {
      if (!btnWrap && !resendBtn) return;
      if (btnWrap) btnWrap.style.display = show ? '' : 'none';
      else resendBtn.style.display = show ? '' : 'none';
    };
    // butonul “Am verificat” nu il folosim
    if (checkBtn) checkBtn.style.display = 'none';
    // ✅ IMPORTANT: NU lasam placeholder-ul din Webflow (“Se proceseaza…”) sa fie vizibil vreodata
    showBtnArea(false);
    setMsg(''); // gol din start (cardul e oricum ascuns in preload)
    /* ==================== helpers: return path ==================== */
    const normPath = (p) => {
      p = String(p || '/');
      p = p.split('#')[0];
      return p || '/';
    };
    // Consumam mereu RETURN_KEY (sa nu ramana “stale”)
    const getAfterVerifyPath = () => {
      let p = '';
      try { p = sessionStorage.getItem(RETURN_KEY) || ''; } catch(_) {}
      try { sessionStorage.removeItem(RETURN_KEY); } catch(_) {}
      if (AFTER_VERIFY_MODE === 'home') return DEFAULT_AFTER;
      if (!p || typeof p !== 'string') return DEFAULT_AFTER;
      if (!p.startsWith('/')) return DEFAULT_AFTER;
      const base = normPath(p).split('?')[0].replace(/\/+$/, '') || '/';
      const BLOCK = {
        '/auth': true,
        '/confirmare-email': true,
        '/resetare-parola': true,
        '/verifica-email': true,
        '/signup': true,
        '/sign-up': true,
        '/login': true
      };
      if (BLOCK[base]) return DEFAULT_AFTER;
      return p;
    };
    /* ==================== snapshot helpers ==================== */
    const writeSnap = (obj) => { try { localStorage.setItem(SNAP_KEY, JSON.stringify(obj)); } catch(_){} };
    const snapAnon  = () => writeSnap({ a:0, ev:0, uid:'', t:Date.now() });
    const snapUser  = (user, evOverride) => writeSnap({
      a:1,
      uid: String(user && user.uid || ''),
      ev: (typeof evOverride === 'number') ? evOverride : ((user && user.emailVerified) ? 1 : 0),
      t: Date.now()
    });
    /* ==================== Firebase wait ==================== */
    const waitForAuth = (timeoutMs = 8000) => new Promise((resolve, reject) => {
      const t0 = Date.now();
      const tick = () => {
        const ok = window.firebase && typeof window.firebase.auth === 'function';
        if (ok) return resolve(window.firebase.auth());
        if (Date.now() - t0 > timeoutMs) return reject(new Error('auth-timeout'));
        setTimeout(tick, 50);
      };
      tick();
    });
    /* =================== RTDB helpers (server-side) =================== */
    const claimAutoSendOnceServerSide = (user) => new Promise((resolve) => {
      try {
        if (!firebase || !firebase.database) return resolve({ ok:false, committed:false, reason:'no-rtdb' });
        const ref = firebase.database().ref(RTDB_ROOT_PATH).child(String(user.uid));
        ref.transaction(
          (cur) => {
            if (cur && cur.firstSentAt) return; // abort
            const now = Date.now();
            return Object.assign({}, cur || {}, {
              firstSentAt: now,
              firstSentBy: 'auto',
              v: 1
            });
          },
          (err, committed, snap) => {
            if (err) return resolve({ ok:false, committed:false, reason:'tx-error', err });
            resolve({ ok:true, committed: !!committed, data: snap ? snap.val() : null });
          },
          false
        );
      } catch (e) {
        resolve({ ok:false, committed:false, reason:'exception', err:e });
      }
    });
    const claimManualSendServerSide = (user) => new Promise((resolve) => {
      try {
        if (!firebase || !firebase.database) return resolve({ ok:false, committed:false, reason:'no-rtdb' });
        const ref = firebase.database().ref(RTDB_ROOT_PATH).child(String(user.uid)).child('manual');
        ref.transaction(
          (cur) => {
            const now = Date.now();
            cur = cur || {};
            const ws = (typeof cur.windowStartAt === 'number') ? cur.windowStartAt : 0;
            const ct = (typeof cur.count === 'number') ? cur.count : 0;
            const inWindow = ws && (now - ws) < MANUAL_WINDOW_MS;
            if (inWindow) {
              if (ct >= MANUAL_BURST_MAX) return; // abort
              return { windowStartAt: ws, count: ct + 1, lastSentAt: now };
            }
            return { windowStartAt: now, count: 1, lastSentAt: now };
          },
          (err, committed, snap) => {
            if (err) return resolve({ ok:false, committed:false, reason:'tx-error', err });
            resolve({ ok:true, committed: !!committed, data: snap ? snap.val() : null });
          },
          false
        );
      } catch (e) {
        resolve({ ok:false, committed:false, reason:'exception', err:e });
      }
    });
    const calcWaitMsFromManual = (now, manualData) => {
      if (!manualData || typeof manualData.windowStartAt !== 'number') return 0;
      const elapsed = now - manualData.windowStartAt;
      if (elapsed >= MANUAL_WINDOW_MS) return 0;
      return MANUAL_WINDOW_MS - elapsed;
    };
    /* ==================== X / back ==================== */
    if (closeBtn) {
      closeBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        try {
          const auth = await waitForAuth(2500);
          if (auth && auth.currentUser) {
            try { await auth.signOut(); } catch(_) {}
          }
        } catch(_) {}
        snapAnon();
        try { localStorage.removeItem(STORAGE_VERIFIED_PING); } catch(_) {}
        try { sessionStorage.removeItem(RETURN_KEY); } catch(_) {}
        window.location.assign(DEFAULT_AFTER);
      });
    }
    /* ================= Verify detection ================= */
    let checking = false;
    let lastCheckAt = 0;
    const CHECK_THROTTLE_MS = 2000;
    const ensureEmailVerifiedClaim = async (user) => {
      try {
        let tokenRes = await user.getIdTokenResult();
        if (tokenRes?.claims?.email_verified === true) return true;
        await user.getIdToken(true);
        tokenRes = await user.getIdTokenResult();
        return tokenRes?.claims?.email_verified === true;
      } catch (_) { return false; }
    };
    const checkVerifiedAndRedirect = async (auth) => {
      const user = auth.currentUser;
      if (!user) return false;
      const now = Date.now();
      if (checking || (now - lastCheckAt) < CHECK_THROTTLE_MS) return false;
      checking = true;
      lastCheckAt = now;
      try {
        await user.reload();
        if (user.emailVerified) {
          const ok = await ensureEmailVerifiedClaim(user);
          if (!ok) {
            // ✅ aici are sens sa afisam un mesaj (nu placeholder), deci scoatem preload
            showBtnArea(false);
            setMsg('Email confirmat. Se sincronizeaza sesiunea… (revino in cateva secunde)', 'info');
            if (!revealedOnce) revealFirst();
            return true;
          }
          setMsg('Super! Email confirmat. Te redirectionez…', 'ok');
          try { localStorage.setItem(STORAGE_VERIFIED_PING, String(Date.now())); } catch(_) {}
          snapUser(user, 1);
          const to = getAfterVerifyPath();
          window.location.replace(to);
          return true;
        }
      } catch (_) {
      } finally {
        checking = false;
      }
      return false;
    };
    /* ================= Polling ================= */
    let pollTimer = null;
    let pollDelay = 1500;
    let pollStopAt = 0;
    const stopPolling = () => {
      if (pollTimer) clearTimeout(pollTimer);
      pollTimer = null;
      pollStopAt = 0;
    };
    const schedulePoll = (auth) => {
      if (!pollStopAt) return;
      if (Date.now() > pollStopAt) { stopPolling(); return; }
      if (pollTimer) clearTimeout(pollTimer);
      pollTimer = setTimeout(async () => {
        pollTimer = null;
        if (document.visibilityState !== 'visible') {
          schedulePoll(auth);
          return;
        }
        const done = await checkVerifiedAndRedirect(auth);
        if (done) return;
        pollDelay = Math.min(POLL_MAX_DELAY_MS, Math.round(pollDelay * POLL_FACTOR));
        schedulePoll(auth);
      }, pollDelay);
    };
    const startPolling = (auth) => {
      if (pollStopAt) return;
      pollStopAt = Date.now() + ACTIVE_POLL_WINDOW_MS;
      pollDelay = POLL_START_DELAY_MS;
      schedulePoll(auth);
    };
    const showUnverifiedBaseMessageOnce = () => {
      if (!msgEl) return;
      if (msgEl.dataset._baseShown === '1') return;
      msgEl.dataset._baseShown = '1';
      setMsg(
        'Ti-am trimis un email cu un link de verificare. Deschide emailul si apasa pe link. ' +
        'Dupa confirmare, aceasta pagina te va duce automat mai departe.',
        'info'
      );
    };
    /* ===================== MAIN ===================== */
    waitForAuth().then((auth) => {
      window.addEventListener('focus', () => checkVerifiedAndRedirect(auth));
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') checkVerifiedAndRedirect(auth);
      });
      window.addEventListener('storage', (e) => {
        if (e && e.key === STORAGE_VERIFIED_PING) checkVerifiedAndRedirect(auth);
      });
      let pendingLogoutTimer = null;
      const commitLoggedOutUI = () => {
        // ✅ NU aratam butoane, NU aratam placeholder; afisam direct mesaj final util
        showBtnArea(false);
        setMsg('Trebuie sa fii logat ca sa poti finaliza verificarea. Mergi la Login si revino aici.', 'err');
        stopPolling();
        snapAnon();
        // Reveal + fade doar la schimbare reala
        if (!revealedOnce) revealFirst();
        else if (lastState === 'in') fadeMajor();
        lastState = 'out';
      };
      auth.onAuthStateChanged(async (user) => {
        if (pendingLogoutTimer) { clearTimeout(pendingLogoutTimer); pendingLogoutTimer = null; }
        if (!user) {
          // Delay ca sa evitam “flash” la schimbari rapide de sesiune
          pendingLogoutTimer = setTimeout(() => {
            if (auth.currentUser) return;
            commitLoggedOutUI();
          }, LOGOUT_MESSAGE_DELAY_MS);
          return;
        }
        // ✅ Avem user: intai curatam UI-ul (ca sa nu apara “Se proceseaza…”)
        showBtnArea(false);
        setMsg('');
        snapUser(user, user.emailVerified ? 1 : 0);
        // Incercam intai sa detectam verificarea (fara sa aratam cardul prematur)
        await checkVerifiedAndRedirect(auth);
        if (user.emailVerified) return; // daca e verificat, checkVerifiedAndRedirect redirectioneaza
        // ✅ Abia acum: user e logat + NEverificat => aratam mesajul util + butonul real
        showUnverifiedBaseMessageOnce();
        showBtnArea(true);
        if (!revealedOnce) revealFirst();
        else if (lastState === 'out') fadeMajor();
        lastState = 'in';
        // ✅ AUTO-SEND o singura data cross-device, doar imediat dupa creare
        const createdAt = (() => {
          try {
            const t = new Date(user.metadata?.creationTime || '').getTime();
            return Number.isFinite(t) ? t : Date.now();
          } catch(_) { return Date.now(); }
        })();
        const age = Date.now() - createdAt;
        if (age <= AUTO_SEND_ONLY_WHEN_NEW_MS) {
          const claim = await claimAutoSendOnceServerSide(user);
          if (claim.ok && claim.committed) {
            try {
              await user.sendEmailVerification(actionCodeSettings);
            } catch (errSend) {
              if (errSend?.code === 'auth/too-many-requests') {
                setMsg('Prea multe incercari. Te rugam foloseste „Retrimite email” peste cateva minute.', 'err');
              } else {
                setMsg('Nu am putut trimite emailul automat. Foloseste „Retrimite email”.', 'err');
              }
            }
          }
        }
        startPolling(auth);
      });
      // ✅ Retrimite email — server-side throttle cross-device
      if (resendBtn) {
        resendBtn.addEventListener('click', async (e) => {
          e.preventDefault();
          const user = auth.currentUser;
          if (!user) {
            showBtnArea(false);
            setMsg('Trebuie sa fii logat ca sa retrimiti emailul. Mergi la Login.', 'err');
            snapAnon();
            return;
          }
          try {
            await user.reload();
            if (user.emailVerified) {
              await checkVerifiedAndRedirect(auth);
              return;
            }
            resendBtn.disabled = true;
            const now = Date.now();
            const claim = await claimManualSendServerSide(user);
            if (!claim.ok) {
              setMsg('Eroare: nu pot valida throttling-ul server-side. Incearca din nou.', 'err');
              return;
            }
            if (!claim.committed) {
              const waitMs = calcWaitMsFromManual(now, claim.data);
              const sec = Math.max(1, Math.ceil((waitMs || MANUAL_WINDOW_MS) / 1000));
              setMsg('Poti retrimite emailul peste ' + sec + ' secunde.', 'info');
              return;
            }
            await user.sendEmailVerification(actionCodeSettings);
            // ✅ aici NU facem fade (e doar feedback de mesaj, nu schimbare majora)
            setMsg('Am retrimis emailul. Verifica Inbox si Spam.', 'ok');
            startPolling(auth);
          } catch (err) {
            if (err?.code === 'auth/too-many-requests') {
              setMsg('Prea multe incercari. Te rugam incearca din nou peste cateva minute.', 'err');
            } else {
              const m = err?.message ? String(err.message) : 'eroare';
              setMsg('Nu am putut retrimite emailul: ' + m, 'err');
            }
          } finally {
            setTimeout(() => { if (resendBtn) resendBtn.disabled = false; }, 1200);
          }
        });
      }
    }).catch(() => {
      // Daca Auth nu se incarca, afisam direct un mesaj final (nu “Se proceseaza…”)
      showBtnArea(false);
      setMsg('Eroare: Firebase Auth nu este incarcat pe aceasta pagina.', 'err');
      snapAnon();
      revealFirst();
      lastState = 'out';
    });
  };
  if (window.Webflow && Array.isArray(window.Webflow)) window.Webflow.push(boot);
  else if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
